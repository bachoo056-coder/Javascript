<html>
    <head>
        <script>
            function changeColor(c) {
                document.getElementById("target").style.backgroundColor=c;
            }
        </script>
    </head>
    <body id="target">
        <form method="post">
            <input type="radio" name="C1" value="V1"
            onclick="changeColor('lightblue')"/>Lightblue
            <input type="radio" name="C1" value="V1"
            onclick="changeColor('lightgreen')"/>Lightgreen
        </form>
    </body>
</html>
