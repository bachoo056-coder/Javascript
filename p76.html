<html>
    <head>
        <script>
        function OnMouseIn(elem) {
            elem.style.border="2px solid black";
        }
        function OnMouseOut(elem) {
            elem.style.border="";
        }
    </script>
    </head>
    <body id="target">
        <div style="background-color:rgb(201, 139, 170); width:200px"
        onmouseover="OnMouseIn(this)" onmouseout="OnMouseOut(this)">
        Mouse move in.</div>
    </body>
</html>
